<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where a wrong GSI name gets caught</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #0a0a0b;
    --color-ink: #fafafa;
    --color-muted: #a1a1ab;
    --color-accent: #ff5a5a;
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart &#183; Diagram Design</p>
    <h1>Where a wrong GSI name gets caught</h1>
    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gsi-feedback-loop-dark-title gsi-feedback-loop-dark-desc">
      <title id="gsi-feedback-loop-dark-title">Where a wrong GSI name gets caught</title>
      <desc id="gsi-feedback-loop-dark-desc">A flowchart comparing two ways to run a new DynamoDB index query: against a local emulator, where a wrong index name surfaces in seconds before anything is deployed, and directly in AWS, where the same error costs a full pipeline run and forces a rework loop back through the pull request.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff5a5a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa7ec"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#0a0a0b"/>

      <!-- arrows -->
      <line x1="480" y1="80" x2="480" y2="124" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 384,164 H 228 Q 220,164 220,172 V 256" fill="none" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 576,164 H 732 Q 740,164 740,172 V 256" fill="none" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="316" x2="220" y2="380" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="440" x2="220" y2="504" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="316" x2="740" y2="380" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="440" x2="740" y2="504" stroke="#a1a1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 630,534 H 598 Q 590,534 590,526 V 294 Q 590,286 598,286 H 630" fill="none" stroke="#ff5a5a" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

      <!-- arrow labels -->
      <rect x="286" y="144" width="40" height="12" rx="2" fill="#0a0a0b"/>
      <text x="306" y="153" fill="#8b8b95" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCAL</text>
      <rect x="632" y="144" width="44" height="12" rx="2" fill="#0a0a0b"/>
      <text x="654" y="153" fill="#8b8b95" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLOUD</text>
      <rect x="538" y="404" width="44" height="12" rx="2" fill="#0a0a0b"/>
      <text x="560" y="413" fill="#ff5a5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REWORK</text>

      <!-- start -->
      <rect x="360" y="40" width="240" height="40" rx="20" fill="#0a0a0b"/>
      <rect x="360" y="40" width="240" height="40" rx="20" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="480" y="65" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A query needs a new GSI</text>

      <!-- decision -->
      <polygon points="480,124 576,164 480,204 384,164" fill="#0a0a0b"/>
      <polygon points="480,124 576,164 480,204 384,164" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="480" y="160" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Where does it</text>
      <text x="480" y="176" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">run first?</text>

      <!-- local lane -->
      <rect x="110" y="256" width="220" height="60" rx="6" fill="#0a0a0b"/>
      <rect x="110" y="256" width="220" height="60" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="220" y="282" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Emulator container</text>
      <text x="220" y="300" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost:4566</text>

      <rect x="110" y="380" width="220" height="60" rx="6" fill="#0a0a0b"/>
      <rect x="110" y="380" width="220" height="60" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="220" y="406" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ValidationException</text>
      <text x="220" y="424" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~2s &#183; nothing deployed</text>

      <rect x="100" y="504" width="240" height="56" rx="28" fill="#0a0a0b"/>
      <rect x="100" y="504" width="240" height="56" rx="28" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="220" y="536" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fixed before the PR</text>

      <!-- cloud lane -->
      <rect x="630" y="256" width="220" height="60" rx="6" fill="#0a0a0b"/>
      <rect x="630" y="256" width="220" height="60" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="740" y="282" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PR + terraform apply</text>
      <text x="740" y="300" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ci pipeline</text>

      <rect x="630" y="380" width="220" height="60" rx="6" fill="#0a0a0b"/>
      <rect x="630" y="380" width="220" height="60" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="740" y="406" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deploy app, run query</text>
      <text x="740" y="424" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cd pipeline</text>

      <rect x="630" y="504" width="220" height="60" rx="6" fill="#0a0a0b"/>
      <rect x="630" y="504" width="220" height="60" rx="6" fill="rgba(255,90,90,0.12)" stroke="#ff5a5a" stroke-width="1"/>
      <text x="740" y="530" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ValidationException</text>
      <text x="740" y="548" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~14min &#183; 2 deploys</text>

      <!-- legend -->
      <line x1="30" y1="604" x2="930" y2="604" stroke="rgba(250,250,250,0.12)" stroke-width="0.8"/>
      <text x="30" y="621" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="150" y="612" width="24" height="10" rx="5" fill="none" stroke="#fafafa" stroke-width="1"/>
      <text x="182" y="621" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Start / end</text>
      <rect x="310" y="612" width="24" height="10" rx="2" fill="none" stroke="#fafafa" stroke-width="1"/>
      <text x="342" y="621" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Step</text>
      <polygon points="482,611 493,620 482,629 471,620" fill="none" stroke="#fafafa" stroke-width="1"/>
      <text x="502" y="621" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Decision</text>
      <line x1="630" y1="620" x2="654" y2="620" stroke="#ff5a5a" stroke-width="1.5"/>
      <text x="662" y="621" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Rework loop</text>
    </svg>

  </div>
</body>
</html>
