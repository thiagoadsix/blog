<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renaming a column without downtime</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #0a0a0b;
    --color-ink: #fafafa;
    --color-muted: #a1a1ab;
    --color-accent: #ff5a5a;
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline &#183; Diagram Design</p>
    <h1>Renaming a column without downtime</h1>
    <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expand-contract-dark-title expand-contract-dark-desc">
      <title id="expand-contract-dark-title">Renaming a column without downtime</title>
      <desc id="expand-contract-dark-desc">Renaming users.email to users.email_address takes five deploys, with the schema and the deployed application shown as parallel tracks: the two columns deliberately overlap, so at every step the previous version of the application is still correct against the current schema and any deploy can be reverted without a schema rollback, right up to the final drop, which cannot be undone that way.</desc>
      <defs>
        <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1ab"/></marker>
        <marker id="arrow-accent-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff5a5a"/></marker>
        <marker id="arrow-link-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa7ec"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#0a0a0b"/>

      <!-- schema track -->
      <text x="32" y="48" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SCHEMA &#183; TABLE users</text>

      <!-- application track eyebrow -->
      <text x="32" y="428" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">APPLICATION &#183; DEPLOYED CODE</text>

      <!-- time axis -->
      <line x1="152" y1="296" x2="928" y2="296" stroke="rgba(227,227,232,0.22)" stroke-width="1" marker-end="url(#arrow-dark)"/>
      <line x1="248" y1="290" x2="248" y2="302" stroke="rgba(227,227,232,0.22)" stroke-width="1"/>
      <line x1="384" y1="290" x2="384" y2="302" stroke="rgba(227,227,232,0.22)" stroke-width="1"/>
      <line x1="520" y1="290" x2="520" y2="302" stroke="rgba(227,227,232,0.22)" stroke-width="1"/>
      <line x1="656" y1="290" x2="656" y2="302" stroke="rgba(227,227,232,0.22)" stroke-width="1"/>
      <line x1="792" y1="290" x2="792" y2="302" stroke="rgba(227,227,232,0.22)" stroke-width="1"/>

      <!-- point of no return guide -->
      <line x1="792" y1="256" x2="792" y2="286" stroke="#ff5a5a" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="792" y1="340" x2="792" y2="360" stroke="#ff5a5a" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="792" y1="400" x2="792" y2="440" stroke="#ff5a5a" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- schema bars -->
      <rect x="152" y="64" width="640" height="56" rx="6" fill="#0a0a0b"/>
      <rect x="152" y="64" width="640" height="56" rx="6" fill="rgba(250,250,250,0.05)" stroke="#a1a1ab" stroke-width="1"/>
      <text x="168" y="92" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Old column</text>
      <text x="168" y="108" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace">users.email</text>
      <line x1="792" y1="66" x2="792" y2="118" stroke="#ff5a5a" stroke-width="2.5"/>

      <rect x="248" y="132" width="672" height="56" rx="6" fill="#0a0a0b"/>
      <rect x="248" y="132" width="672" height="56" rx="6" fill="rgba(250,250,250,0.05)" stroke="#a1a1ab" stroke-width="1"/>
      <text x="264" y="160" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif">New column</text>
      <text x="264" y="176" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace">users.email_address, nullable</text>

      <rect x="520" y="200" width="136" height="52" rx="6" fill="#0a0a0b"/>
      <rect x="520" y="200" width="136" height="52" rx="6" fill="rgba(250,250,250,0.02)" stroke="rgba(250,250,250,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="588" y="224" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backfill</text>
      <text x="588" y="240" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">batched &#183; resumable</text>

      <text x="812" y="220" fill="#fafafa" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">both columns exist</text>
      <text x="812" y="238" fill="#fafafa" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">on purpose</text>

      <!-- deploy markers -->
      <circle cx="248" cy="296" r="4" fill="#a1a1ab"/>
      <circle cx="384" cy="296" r="4" fill="#a1a1ab"/>
      <circle cx="520" cy="296" r="4" fill="#a1a1ab"/>
      <circle cx="656" cy="296" r="4" fill="#a1a1ab"/>
      <circle cx="792" cy="296" r="6" fill="#ff5a5a"/>

      <text x="248" y="318" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOY 1</text>
      <text x="248" y="332" fill="#fafafa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADD COLUMN</text>
      <text x="384" y="318" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOY 2</text>
      <text x="384" y="332" fill="#fafafa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE BOTH</text>
      <text x="520" y="318" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOY 3</text>
      <text x="520" y="332" fill="#fafafa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BACKFILL</text>
      <text x="656" y="318" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOY 4</text>
      <text x="656" y="332" fill="#fafafa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ NEW</text>
      <text x="792" y="318" fill="#ff5a5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEPLOY 5</text>
      <text x="792" y="332" fill="#ff5a5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DROP OLD</text>

      <!-- rollback-safe window -->
      <rect x="248" y="364" width="544" height="32" rx="6" fill="rgba(255,90,90,0.12)" stroke="#ff5a5a" stroke-width="1"/>
      <text x="520" y="384" fill="#ff5a5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ROLLBACK SAFE &#183; PREVIOUS CODE STILL CORRECT</text>

      <!-- application bars -->
      <rect x="152" y="444" width="224" height="80" rx="6" fill="#0a0a0b"/>
      <rect x="152" y="444" width="224" height="80" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="264" y="474" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Current code</text>
      <text x="264" y="494" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes email</text>
      <text x="264" y="510" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads email</text>

      <rect x="384" y="444" width="264" height="80" rx="6" fill="#0a0a0b"/>
      <rect x="384" y="444" width="264" height="80" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="516" y="474" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dual write</text>
      <text x="516" y="494" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes both columns</text>
      <text x="516" y="510" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads email</text>

      <rect x="656" y="444" width="128" height="80" rx="6" fill="#0a0a0b"/>
      <rect x="656" y="444" width="128" height="80" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="720" y="474" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reads new</text>
      <text x="720" y="494" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes both</text>
      <text x="720" y="510" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads email_address</text>

      <rect x="792" y="444" width="128" height="80" rx="6" fill="#0a0a0b"/>
      <rect x="792" y="444" width="128" height="80" rx="6" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="856" y="474" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New only</text>
      <text x="856" y="494" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes email_address</text>
      <text x="856" y="510" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads email_address</text>

      <text x="480" y="576" fill="#fafafa" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">every deploy before the drop can be reverted on its own &#8212; the drop cannot</text>

      <!-- legend -->
      <line x1="32" y1="636" x2="928" y2="636" stroke="rgba(250,250,250,0.12)" stroke-width="0.8"/>
      <text x="32" y="653" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="643" width="24" height="12" rx="2" fill="rgba(250,250,250,0.05)" stroke="#a1a1ab" stroke-width="1"/>
      <text x="172" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Column exists</text>
      <rect x="276" y="643" width="24" height="12" rx="2" fill="rgba(250,250,250,0.02)" stroke="rgba(250,250,250,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="308" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Backfill window</text>
      <rect x="424" y="643" width="24" height="12" rx="2" fill="#0a0a0b" stroke="#fafafa" stroke-width="1"/>
      <text x="456" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Deployed code</text>
      <rect x="568" y="643" width="24" height="12" rx="2" fill="rgba(255,90,90,0.12)" stroke="#ff5a5a" stroke-width="1"/>
      <text x="600" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Rollback-safe</text>
      <line x1="704" y1="649" x2="728" y2="649" stroke="#ff5a5a" stroke-width="2.5"/>
      <text x="736" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Point of no return</text>
    </svg>

  </div>
</body>
</html>
