<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What each isolation level actually stops</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #0a0a0b;
    --color-ink: #fafafa;
    --color-muted: #a1a1ab;
    --color-accent: #ff5a5a;
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Matrix &#183; Diagram Design</p>
    <h1>What each isolation level actually stops</h1>
    <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isolation-anomalies-dark-title isolation-anomalies-dark-desc">
      <title id="isolation-anomalies-dark-title">What each isolation level actually stops</title>
      <desc id="isolation-anomalies-dark-desc">A matrix of PostgreSQL isolation levels against five concurrency anomalies, showing that the default READ COMMITTED still allows write skew with no error raised, that REPEATABLE READ stops everything except write skew, and that SERIALIZABLE stops all five at the price of serialization failures the application must catch and retry.</desc>
      <defs>
        <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1ab"/></marker>
        <marker id="arrow-accent-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff5a5a"/></marker>
        <marker id="arrow-link-dark" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa7ec"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#0a0a0b"/>

      <!-- header row -->
      <rect x="48" y="104" width="224" height="56" rx="6" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.8"/>
      <text x="160" y="128" fill="#fafafa" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Isolation level</text>
      <text x="160" y="144" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vs. anomaly</text>

      <rect x="284" y="104" width="116" height="56" rx="6" fill="#fafafa"/>
      <text x="342" y="128" fill="#0a0a0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dirty read</text>
      <text x="342" y="144" fill="#0a0a0b" opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">uncommitted</text>

      <rect x="412" y="104" width="116" height="56" rx="6" fill="#fafafa"/>
      <text x="470" y="128" fill="#0a0a0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Non-repeatable</text>
      <text x="470" y="144" fill="#0a0a0b" opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">same row twice</text>

      <rect x="540" y="104" width="116" height="56" rx="6" fill="#fafafa"/>
      <text x="598" y="128" fill="#0a0a0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phantom read</text>
      <text x="598" y="144" fill="#0a0a0b" opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">new rows appear</text>

      <rect x="668" y="104" width="116" height="56" rx="6" fill="#fafafa"/>
      <text x="726" y="128" fill="#0a0a0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lost update</text>
      <text x="726" y="144" fill="#0a0a0b" opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">overwritten</text>

      <rect x="796" y="104" width="116" height="56" rx="6" fill="#fafafa"/>
      <text x="854" y="128" fill="#0a0a0b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write skew</text>
      <text x="854" y="144" fill="#0a0a0b" opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">invariant break</text>

      <!-- row 1: read committed -->
      <rect x="48" y="176" width="224" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.8"/>
      <text x="68" y="206" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Read committed</text>
      <text x="68" y="224" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace">PostgreSQL default</text>

      <rect x="284" y="176" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="337" y="196" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="342" y="222" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="412" y="176" width="116" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="465" y="196" width="10" height="10" rx="2" fill="none" stroke="rgba(250,250,250,0.30)" stroke-width="1.2"/>
      <text x="470" y="222" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POSSIBLE</text>

      <rect x="540" y="176" width="116" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="593" y="196" width="10" height="10" rx="2" fill="none" stroke="rgba(250,250,250,0.30)" stroke-width="1.2"/>
      <text x="598" y="222" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POSSIBLE</text>

      <rect x="668" y="176" width="116" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="721" y="196" width="10" height="10" rx="2" fill="none" stroke="rgba(250,250,250,0.30)" stroke-width="1.2"/>
      <text x="726" y="222" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POSSIBLE</text>

      <rect x="796" y="176" width="116" height="64" rx="4" fill="rgba(255,90,90,0.12)" stroke="#ff5a5a" stroke-width="1.4"/>
      <rect x="849" y="186" width="10" height="10" rx="2" fill="none" stroke="#ff5a5a" stroke-width="1.4"/>
      <text x="854" y="212" fill="#ff5a5a" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POSSIBLE</text>
      <text x="854" y="228" fill="#ff5a5a" opacity="0.85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">NO ERROR RAISED</text>

      <!-- row 2: repeatable read -->
      <rect x="48" y="248" width="224" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.8"/>
      <text x="68" y="278" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Repeatable read</text>
      <text x="68" y="296" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace">snapshot isolation</text>

      <rect x="284" y="248" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="337" y="268" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="342" y="294" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="412" y="248" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="465" y="268" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="470" y="294" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="540" y="248" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="593" y="268" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="598" y="294" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="668" y="248" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="721" y="268" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="726" y="294" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="796" y="248" width="116" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="849" y="268" width="10" height="10" rx="2" fill="none" stroke="rgba(250,250,250,0.30)" stroke-width="1.2"/>
      <text x="854" y="294" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POSSIBLE</text>

      <!-- row 3: serializable -->
      <rect x="48" y="320" width="224" height="64" rx="4" fill="#0a0a0b" stroke="rgba(250,250,250,0.10)" stroke-width="0.8"/>
      <text x="68" y="350" fill="#fafafa" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Serializable</text>
      <text x="68" y="368" fill="#a1a1ab" font-size="9" font-family="'Geist Mono', monospace">predicate locks</text>

      <rect x="284" y="320" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="337" y="340" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="342" y="366" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="412" y="320" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="465" y="340" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="470" y="366" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="540" y="320" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="593" y="340" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="598" y="366" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="668" y="320" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="721" y="340" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="726" y="366" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <rect x="796" y="320" width="116" height="64" rx="4" fill="rgba(250,250,250,0.05)" stroke="rgba(250,250,250,0.10)" stroke-width="0.6"/>
      <rect x="849" y="340" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="854" y="366" fill="#fafafa" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREVENTED</text>

      <!-- the default -->
      <rect x="48" y="424" width="432" height="128" rx="8" fill="rgba(250,250,250,0.02)" stroke="rgba(250,250,250,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="68" y="450" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">READ COMMITTED IS THE DEFAULT</text>
      <text x="68" y="480" fill="#fafafa" font-size="11" font-family="'Geist', sans-serif">A default PostgreSQL install runs every transaction</text>
      <text x="68" y="500" fill="#fafafa" font-size="11" font-family="'Geist', sans-serif">at READ COMMITTED. Every anomaly in the top row</text>
      <text x="68" y="520" fill="#fafafa" font-size="11" font-family="'Geist', sans-serif">except dirty read is reachable with no extra setup.</text>

      <!-- the cost -->
      <text x="512" y="450" fill="#a1a1ab" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE COST &#183; SQLSTATE 40001</text>
      <text x="512" y="482" fill="#ff5a5a" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">serializable is the only row that stops</text>
      <text x="512" y="504" fill="#ff5a5a" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">write skew &#8212; and the only one that</text>
      <text x="512" y="526" fill="#ff5a5a" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">makes your code retry what it refuses</text>

      <!-- legend -->
      <line x1="48" y1="636" x2="912" y2="636" stroke="rgba(250,250,250,0.12)" stroke-width="0.8"/>
      <text x="48" y="653" fill="#a1a1ab" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="644" width="10" height="10" rx="2" fill="#fafafa"/>
      <text x="160" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Prevented by the level</text>
      <rect x="340" y="644" width="10" height="10" rx="2" fill="none" stroke="rgba(250,250,250,0.30)" stroke-width="1.2"/>
      <text x="360" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Possible at this level</text>
      <rect x="540" y="644" width="10" height="10" rx="2" fill="none" stroke="#ff5a5a" stroke-width="1.4"/>
      <text x="560" y="653" fill="#a1a1ab" font-size="9" font-family="'Geist', sans-serif">Write skew under the default</text>
    </svg>

  </div>
</body>
</html>
