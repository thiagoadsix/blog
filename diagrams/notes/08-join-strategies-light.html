<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three ways to join, and when each one wins</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #ffffff;
    --color-ink: #18181b;
    --color-muted: #7b7b85;
    --color-accent: #ee2b2b;
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Comparison &#183; Diagram Design</p>
    <h1>Three ways to join, and when each one wins</h1>
    <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="join-strategies-title join-strategies-desc">
      <title id="join-strategies-title">Three ways to join, and when each one wins</title>
      <desc id="join-strategies-desc">A comparison of nested loop, hash join and merge join for the same two-table join, showing each mechanism, its cost shape and memory need, and the input conditions that make the planner choose it, plus the failure mode where a nested loop is picked on a bad row estimate.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b7b85"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ee2b2b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6fd0"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <text x="32" y="40" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SAME JOIN, THREE PLANS</text>
      <text x="32" y="60" fill="#18181b" font-size="10" font-family="'Geist Mono', monospace">orders o JOIN customers c ON c.id = o.customer_id</text>

      <text x="32" y="84" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STRATEGY</text>
      <text x="208" y="84" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MECHANISM</text>
      <text x="576" y="84" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COST SHAPE</text>
      <text x="736" y="84" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PLANNER PICKS IT WHEN</text>
      <line x1="32" y1="92" x2="928" y2="92" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="232" x2="928" y2="232" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <line x1="32" y1="376" x2="928" y2="376" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>

      <!-- connectors -->
      <line x1="288" y1="160" x2="424" y2="160" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="304" x2="336" y2="304" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="488" y1="304" x2="432" y2="304" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="430" x2="440" y2="430" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="466" x2="440" y2="466" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- connector labels -->
      <rect x="310" y="140" width="92" height="12" rx="2" fill="#ffffff"/>
      <text x="356" y="149" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 SEEK PER ROW</text>
      <rect x="286" y="284" width="44" height="12" rx="2" fill="#ffffff"/>
      <text x="308" y="293" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD</text>
      <rect x="438" y="284" width="44" height="12" rx="2" fill="#ffffff"/>
      <text x="460" y="293" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBE</text>
      <rect x="376" y="410" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="404" y="419" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN ORDER</text>

      <!-- row 1: nested loop -->
      <text x="32" y="154" fill="#18181b" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Nested Loop</text>
      <text x="32" y="172" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace">probe per outer row</text>

      <rect x="224" y="128" width="64" height="64" rx="4" fill="#ffffff"/>
      <rect x="224" y="128" width="64" height="64" rx="4" fill="rgba(123,123,133,0.10)" stroke="#9a9aa3" stroke-width="1"/>
      <line x1="224" y1="144" x2="288" y2="144" stroke="#9a9aa3" stroke-width="0.6"/>
      <line x1="224" y1="160" x2="288" y2="160" stroke="#9a9aa3" stroke-width="0.6"/>
      <line x1="224" y1="176" x2="288" y2="176" stroke="#9a9aa3" stroke-width="0.6"/>
      <text x="256" y="208" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">outer rows</text>

      <rect x="432" y="128" width="96" height="64" rx="4" fill="#ffffff"/>
      <rect x="432" y="128" width="96" height="64" rx="4" fill="rgba(24,24,27,0.05)" stroke="#7b7b85" stroke-width="1"/>
      <text x="480" y="156" fill="#18181b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">customers_pkey</text>
      <text x="480" y="172" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">index seek</text>
      <text x="480" y="208" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">inner side</text>

      <text x="648" y="154" fill="#18181b" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">O(n * m)</text>
      <text x="648" y="172" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no extra memory</text>

      <text x="736" y="152" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">Small outer side, with an index</text>
      <text x="736" y="168" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">on the inner join key</text>

      <!-- row 2: hash join -->
      <text x="32" y="298" fill="#18181b" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Hash Join</text>
      <text x="32" y="316" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace">build, then probe</text>

      <rect x="224" y="284" width="56" height="40" rx="4" fill="rgba(123,123,133,0.10)" stroke="#9a9aa3" stroke-width="1"/>
      <text x="252" y="308" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">smaller</text>
      <text x="252" y="348" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">build side</text>

      <rect x="336" y="272" width="96" height="64" rx="4" fill="#ffffff"/>
      <rect x="336" y="272" width="96" height="64" rx="4" fill="rgba(24,24,27,0.05)" stroke="#7b7b85" stroke-width="1"/>
      <text x="384" y="294" fill="#18181b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hash table</text>
      <text x="384" y="308" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">in work_mem</text>
      <line x1="360" y1="316" x2="360" y2="336" stroke="#7b7b85" stroke-width="0.6"/>
      <line x1="384" y1="316" x2="384" y2="336" stroke="#7b7b85" stroke-width="0.6"/>
      <line x1="408" y1="316" x2="408" y2="336" stroke="#7b7b85" stroke-width="0.6"/>

      <rect x="488" y="284" width="56" height="40" rx="4" fill="rgba(123,123,133,0.10)" stroke="#9a9aa3" stroke-width="1"/>
      <text x="516" y="308" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">larger</text>
      <text x="516" y="348" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">probe side</text>

      <text x="648" y="298" fill="#18181b" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">O(n + m)</text>
      <text x="648" y="316" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ build memory</text>

      <text x="736" y="288" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">Large unsorted inputs, and</text>
      <text x="736" y="304" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">enough work_mem to hold the</text>
      <text x="736" y="320" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">smaller side in one hash table</text>

      <!-- row 3: merge join -->
      <text x="32" y="442" fill="#18181b" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Merge Join</text>
      <text x="32" y="460" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace">zip two streams</text>

      <text x="224" y="408" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace">two sorted inputs</text>
      <rect x="224" y="416" width="144" height="28" rx="4" fill="rgba(123,123,133,0.10)" stroke="#9a9aa3" stroke-width="1"/>
      <text x="296" y="434" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 &#183; 4 &#183; 7 &#183; 9</text>
      <rect x="224" y="452" width="144" height="28" rx="4" fill="rgba(24,24,27,0.05)" stroke="#7b7b85" stroke-width="1"/>
      <text x="296" y="470" fill="#18181b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 &#183; 4 &#183; 8 &#183; 9</text>
      <text x="224" y="500" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace">a sort is added first if they are not already ordered</text>

      <rect x="440" y="424" width="88" height="48" rx="4" fill="#ffffff"/>
      <rect x="440" y="424" width="88" height="48" rx="4" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
      <text x="484" y="446" fill="#18181b" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merge</text>
      <text x="484" y="462" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one pass each</text>

      <text x="648" y="434" fill="#18181b" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">O(n log n +</text>
      <text x="648" y="450" fill="#18181b" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">m log m)</text>
      <text x="648" y="470" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only if it sorts</text>

      <text x="736" y="432" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">Inputs already sorted &#8212; by</text>
      <text x="736" y="448" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">index order, or by a merge-</text>
      <text x="736" y="464" fill="#7b7b85" font-size="10" font-family="'Geist', sans-serif">friendly ORDER BY</text>

      <!-- failure mode (focal) -->
      <rect x="32" y="536" width="896" height="64" rx="8" fill="rgba(238,43,43,0.05)" stroke="rgba(238,43,43,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="56" y="562" fill="#ee2b2b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHEN THE NESTED LOOP GOES WRONG</text>
      <text x="56" y="586" fill="#ee2b2b" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">the planner expects one outer row, gets 48,210 &#8212; and pays for every one of them</text>

      <!-- legend -->
      <line x1="32" y1="636" x2="928" y2="636" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <text x="32" y="653" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="643" width="24" height="12" rx="2" fill="rgba(123,123,133,0.10)" stroke="#9a9aa3" stroke-width="1"/>
      <text x="152" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Driving side</text>
      <rect x="300" y="643" width="24" height="12" rx="2" fill="rgba(24,24,27,0.05)" stroke="#7b7b85" stroke-width="1"/>
      <text x="332" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Probed side</text>
      <line x1="480" y1="649" x2="504" y2="649" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="512" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Row probe</text>
      <rect x="664" y="643" width="24" height="12" rx="2" fill="rgba(238,43,43,0.05)" stroke="rgba(238,43,43,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="696" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Failure mode</text>
    </svg>

  </div>
</body>
</html>
