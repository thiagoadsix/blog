<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One active price, enforced by the schema</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #ffffff;
    --color-ink: #18181b;
    --color-muted: #7b7b85;
    --color-accent: #ee2b2b;
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Database schema &#183; Diagram Design</p>
    <h1>One active price, enforced by the schema</h1>
    <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="price-schema-title price-schema-desc">
      <title id="price-schema-title">One active price, enforced by the schema</title>
      <desc id="price-schema-desc">A physical schema for immutable pricing: plans own plan options, plan options own price rows that are only ever inserted, and a partial unique index on prices by option_id where active rejects any second active price for the same option, so the rule holds even when the application forgets to check.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b7b85"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ee2b2b"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6fd0"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- foreign keys, drawn before the tables -->
      <line x1="344" y1="164" x2="280" y2="164" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="284" y="144" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="312" y="153" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTRICT</text>

      <line x1="640" y1="140" x2="576" y2="140" stroke="#7b7b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="580" y="120" width="56" height="12" rx="2" fill="#ffffff"/>
      <text x="608" y="129" fill="#9a9aa3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTRICT</text>

      <!-- table: plans -->
      <rect x="48" y="120" width="232" height="104" rx="6" fill="#ffffff"/>
      <path d="M 48,126 A 6 6 0 0 1 54,120 H 274 A 6 6 0 0 1 280,126 V 152 H 48 Z" fill="rgba(24,24,27,0.05)"/>
      <rect x="48" y="176" width="232" height="24" fill="rgba(24,24,27,0.02)"/>
      <line x1="48" y1="152" x2="280" y2="152" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <rect x="48" y="120" width="232" height="104" rx="6" fill="none" stroke="#18181b" stroke-width="1"/>
      <text x="60" y="141" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.plans</text>
      <rect x="232" y="130" width="36" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="250" y="139" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="60" y="168" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">id</text>
      <rect x="176" y="158" width="20" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="186" y="167" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PK</text>
      <text x="268" y="168" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="60" y="192" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">name</text>
      <text x="268" y="192" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
      <text x="60" y="216" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">created_at</text>
      <text x="268" y="216" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">timestamptz</text>

      <!-- table: plan_options -->
      <rect x="344" y="96" width="232" height="128" rx="6" fill="#ffffff"/>
      <path d="M 344,102 A 6 6 0 0 1 350,96 H 570 A 6 6 0 0 1 576,102 V 128 H 344 Z" fill="rgba(24,24,27,0.05)"/>
      <rect x="344" y="152" width="232" height="24" fill="rgba(24,24,27,0.02)"/>
      <rect x="344" y="200" width="232" height="24" fill="rgba(24,24,27,0.02)"/>
      <line x1="344" y1="128" x2="576" y2="128" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <rect x="344" y="96" width="232" height="128" rx="6" fill="none" stroke="#18181b" stroke-width="1"/>
      <text x="356" y="117" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.plan_options</text>
      <rect x="528" y="106" width="36" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="546" y="115" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="356" y="144" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">id</text>
      <rect x="472" y="134" width="20" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="482" y="143" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PK</text>
      <text x="564" y="144" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="356" y="168" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">plan_id</text>
      <rect x="472" y="158" width="20" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="482" y="167" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FK</text>
      <text x="564" y="168" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="356" y="192" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">billing_period</text>
      <text x="564" y="192" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
      <text x="356" y="216" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">created_at</text>
      <text x="564" y="216" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">timestamptz</text>

      <!-- table: prices -->
      <text x="640" y="64" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">IMMUTABLE &#183; INSERT-ONLY</text>
      <rect x="640" y="72" width="272" height="244" rx="6" fill="#ffffff"/>
      <path d="M 640,78 A 6 6 0 0 1 646,72 H 906 A 6 6 0 0 1 912,78 V 104 H 640 Z" fill="rgba(24,24,27,0.05)"/>
      <rect x="640" y="128" width="272" height="24" fill="rgba(24,24,27,0.02)"/>
      <rect x="640" y="176" width="272" height="24" fill="rgba(24,24,27,0.02)"/>
      <rect x="640" y="224" width="272" height="24" fill="rgba(24,24,27,0.02)"/>
      <path d="M 640,272 H 912 V 310 A 6 6 0 0 1 906,316 H 646 A 6 6 0 0 1 640,310 Z" fill="rgba(238,43,43,0.05)"/>
      <line x1="640" y1="104" x2="912" y2="104" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <line x1="640" y1="272" x2="912" y2="272" stroke="rgba(238,43,43,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="640" y="72" width="272" height="244" rx="6" fill="none" stroke="#18181b" stroke-width="1"/>
      <text x="652" y="93" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', sans-serif">public.prices</text>
      <rect x="864" y="82" width="36" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="882" y="91" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
      <text x="652" y="120" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">id</text>
      <rect x="808" y="110" width="20" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="818" y="119" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PK</text>
      <text x="900" y="120" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="652" y="144" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">option_id</text>
      <rect x="808" y="134" width="20" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="818" y="143" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FK</text>
      <text x="900" y="144" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
      <text x="652" y="168" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">amount_cents</text>
      <text x="900" y="168" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">bigint</text>
      <text x="652" y="192" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">currency</text>
      <text x="900" y="192" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">char(3)</text>
      <text x="652" y="216" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">provider_price_id</text>
      <text x="900" y="216" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
      <text x="652" y="240" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">active</text>
      <text x="900" y="240" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">boolean</text>
      <text x="652" y="264" fill="#18181b" font-size="12" font-family="'Geist', sans-serif">created_at</text>
      <text x="900" y="264" fill="#7b7b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">timestamptz</text>
      <text x="652" y="288" fill="#ee2b2b" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PARTIAL UNIQUE INDEX</text>
      <text x="652" y="306" fill="#ee2b2b" font-size="9" font-family="'Geist Mono', monospace">one_active_price (option_id) WHERE active</text>

      <!-- what the index refuses -->
      <rect x="48" y="396" width="432" height="136" rx="8" fill="rgba(24,24,27,0.02)" stroke="rgba(24,24,27,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="68" y="422" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT THE INDEX REFUSES</text>
      <text x="68" y="450" fill="#18181b" font-size="9" font-family="'Geist Mono', monospace">INSERT INTO prices (option_id, amount_cents, active)</text>
      <text x="68" y="468" fill="#18181b" font-size="9" font-family="'Geist Mono', monospace">VALUES (7, 1900, true);</text>
      <text x="68" y="496" fill="#ee2b2b" font-size="9" font-family="'Geist Mono', monospace">ERROR: duplicate key value violates unique</text>
      <text x="68" y="514" fill="#ee2b2b" font-size="9" font-family="'Geist Mono', monospace">constraint "one_active_price"</text>

      <!-- editorial payoff -->
      <text x="696" y="440" fill="#18181b" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">a second active price for the same</text>
      <text x="696" y="462" fill="#18181b" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">option cannot exist &#8212; even if the</text>
      <text x="696" y="484" fill="#18181b" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">application forgets to check</text>

      <!-- legend -->
      <line x1="48" y1="636" x2="912" y2="636" stroke="rgba(24,24,27,0.12)" stroke-width="0.8"/>
      <text x="48" y="653" fill="#7b7b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="643" width="20" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.40)" stroke-width="0.8"/>
      <text x="150" y="652" fill="#7b7b85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PK</text>
      <text x="168" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Key column</text>
      <line x1="308" y1="649" x2="332" y2="649" stroke="#7b7b85" stroke-width="1.2"/>
      <text x="340" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Foreign key</text>
      <rect x="500" y="643" width="20" height="12" rx="2" fill="rgba(238,43,43,0.05)" stroke="rgba(238,43,43,0.50)" stroke-width="0.8"/>
      <text x="528" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Partial unique index</text>
      <rect x="712" y="643" width="20" height="12" rx="2" fill="rgba(24,24,27,0.02)" stroke="rgba(24,24,27,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <text x="740" y="653" fill="#7b7b85" font-size="9" font-family="'Geist', sans-serif">Rejected write</text>
    </svg>

  </div>
</body>
</html>
